<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="히로시마 교류">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>히로시마 교류</title>
<style>
:root{--pri:#1e40af;--pri2:#3b82f6;--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--tx:#0f172a;--sub:#64748b;--red:#dc2626;--ok:#059669;--warn:#d97706}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;background:#cbd5e1;color:var(--tx);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
header{background:var(--card);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:8px}
header h1{font-size:18px;margin:0;color:var(--pri);flex:1;line-height:1.2}
header h1 small{display:block;font-size:11px;color:var(--sub);font-weight:500}
.hbtn{width:40px;height:40px;border-radius:50%;background:#eff6ff;font-size:19px;position:relative;flex:none}
.hbtn.sos{background:#fee2e2}
.badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.badge:empty{display:none}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;overflow-y:auto;padding:14px;display:none;-webkit-overflow-scrolling:touch}
.view.on{display:block}
#v-talk.on{display:flex;flex-direction:column;padding:0;overflow:hidden}
nav{background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--sub);padding:4px 0;position:relative}
nav button i{font-style:normal;font-size:21px;filter:grayscale(1);opacity:.6;position:relative}
nav button.on{color:var(--pri);font-weight:700}
nav button.on i{filter:none;opacity:1}
nav .badge{top:-4px;right:-12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(135deg,#1e40af,#4f46e5);color:#fff;border:0}
.hero h2{margin:0 0 2px;font-size:17px}.hero p{margin:0;font-size:13px;opacity:.9}
.hero .dday{display:inline-block;margin-top:10px;background:rgba(255,255,255,.2);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600}
h3.sec{font-size:14px;margin:18px 2px 8px;color:#334155}
.next b{color:var(--pri)}.next .t{font-size:12px;color:var(--sub)}
.next .now{border-left:3px solid var(--ok);padding-left:10px;margin-bottom:10px}
.next .nx{border-left:3px solid var(--pri2);padding-left:10px}
.notice{border-left:4px solid var(--warn)}
.meta{font-size:12px;color:var(--sub)}
.notice p{margin:4px 0 10px;white-space:pre-wrap;word-break:break-word}
.muster{background:#fef2f2;border:2px solid #fca5a5}
.muster .big{font-size:22px;font-weight:800;color:var(--red);line-height:1.25}
.wx{display:flex;gap:10px;align-items:center;padding:10px 14px}.wx b{font-size:14px}.wx .d{flex:1;font-size:13px;color:#475569}
.tipbox{background:#fffbeb;border:1px solid #fde68a}.tipbox ul.pl{margin:0}.tipbox li{font-size:13.5px}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--pri);color:#fff;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
.btn.full{width:100%}.btn.big{padding:14px;font-size:16px}
.btn.ghost{background:#eff6ff;color:var(--pri)}.btn.gray{background:#e2e8f0;color:#334155}
.btn.ok{background:var(--ok)}.btn.red{background:#fee2e2;color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5}
.done{color:var(--ok);font-weight:700;font-size:14px}
.miss{font-size:12px;color:var(--red);margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;font-weight:600;font-size:13px;width:100%}
.tile i{display:block;font-style:normal;font-size:26px;margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.sp{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:#475569;position:relative}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.seg{display:flex;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.seg button{flex:1;padding:11px 0;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;position:relative}
.seg button.on{color:var(--pri);border-color:var(--pri)}
.seg .badge,.chip .badge{position:static;display:inline-flex;margin-left:4px;vertical-align:middle}
.seg .badge:empty{display:none}
.pane{flex:1;min-height:0;display:none;flex-direction:column}.pane.on{display:flex}
#chatList{flex:1;min-height:0;overflow-y:auto;padding:4px 14px 10px}
.msg{display:flex;gap:8px;margin:8px 0;align-items:flex-end}
.msg.me{flex-direction:row-reverse}
.msg .bub{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 11px;white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.msg.me .bub{background:#dbeafe;border-color:#bfdbfe}
.msg .who{font-size:11.5px;color:var(--sub);margin-bottom:2px;font-weight:600}
.msg .tm{font-size:10.5px;color:#94a3b8;flex:none}
.msg img{max-width:100%;max-height:260px;object-fit:cover;border-radius:10px;display:block}
.msg .del{font-size:11px;color:#94a3b8}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
.g1{background:#f97316}.g2{background:#3b82f6}.g3{background:#10b981}.g4{background:#a855f7}.gT{background:#334155}
.gtag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:#f1f5f9;color:#475569;margin-left:4px}
.mtag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:#fef3c7;color:#92400e;margin-left:4px}
.inbar{display:flex;gap:8px;padding:8px 12px;background:var(--card);border-top:1px solid var(--line);align-items:flex-end;flex:none}
.inbar textarea,.inbar input{flex:1;border:1px solid var(--line);border-radius:18px;padding:9px 13px;background:#f8fafc;resize:none;max-height:96px;outline:none;min-width:0}
.ibtn{width:40px;height:40px;border-radius:50%;background:#eff6ff;font-size:18px;flex:none}
.ibtn.send{background:var(--pri);color:#fff}
#feedWrap{flex:1;min-height:0;overflow-y:auto;padding:0 14px 80px}
.fab{position:absolute;right:16px;bottom:84px;background:var(--pri);color:#fff;border-radius:99px;padding:12px 18px;font-weight:700;box-shadow:0 6px 16px rgba(30,64,175,.35);z-index:5}
.post .head{display:flex;gap:9px;align-items:center;margin-bottom:8px}
.post .nm{font-weight:700;font-size:14px}
.post .txt{white-space:pre-wrap;word-break:break-word;margin:0 0 8px}
.media{display:grid;gap:3px;border-radius:12px;overflow:hidden;margin-bottom:8px}
.media.n1{grid-template-columns:1fr}.media.n2,.media.n4{grid-template-columns:1fr 1fr}
.media.n3,.media.n5{grid-template-columns:1fr 1fr 1fr}
.media > *,.alb > *{aspect-ratio:1;width:100%;height:100%;object-fit:cover;background:#e2e8f0;display:block}
.media.n1 > *{aspect-ratio:4/3}
.alb{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;border-radius:12px;overflow:hidden;margin-bottom:6px}
.vtile{position:relative;display:flex;align-items:center;justify-content:center;background:#0f172a!important;color:#fff;width:100%}
.vtile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75}
.vtile span{position:relative;z-index:1;background:rgba(0,0,0,.45);border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:22px}
.linkbox{display:block;background:#f1f5f9;border-radius:10px;padding:9px 11px;font-size:13px;color:var(--pri);word-break:break-all;margin-bottom:8px;text-decoration:none}
.reacts{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.rb{border:1px solid var(--line);background:#f8fafc;border-radius:99px;padding:4px 9px;font-size:14px;display:flex;gap:4px;align-items:center}
.rb b{font-size:12px;color:#475569}.rb.on{background:#dbeafe;border-color:#93c5fd}
.cbtn{margin-left:auto;font-size:13px;color:#475569;font-weight:600;padding:5px 4px}
.cmt{display:flex;gap:8px;padding:9px 0;border-top:1px solid #f1f5f9}
.cmt .b{flex:1;min-width:0}.cmt p{margin:1px 0 0;white-space:pre-wrap;word-break:break-word;font-size:14px}
.empty{text-align:center;color:#94a3b8;padding:36px 0;font-size:14px}
.mcard{border-left:4px solid var(--pri2)}
.mcard h4{margin:0 0 4px;font-size:15px}.mcard p{margin:0 0 10px;font-size:13px;color:#475569;white-space:pre-wrap}
.gst{display:flex;gap:6px;margin-bottom:10px}
.gst span{flex:1;text-align:center;font-size:12px;font-weight:700;border-radius:8px;padding:6px 0;background:#f1f5f9;color:#94a3b8}
.gst span.y{background:#d1fae5;color:#047857}
.bingo{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin:10px 0}
.bingo button{aspect-ratio:1;border-radius:10px;background:#f1f5f9;border:1px dashed #cbd5e1;font-size:12.5px;font-weight:600;color:#475569;padding:6px;position:relative;overflow:hidden;word-break:keep-all}
.bingo button img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bingo button em{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-style:normal;font-size:10.5px;padding:2px 3px}
.bar{position:relative;display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:6px;overflow:hidden;background:#f8fafc;font-weight:600;font-size:14px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#dbeafe;z-index:0}.bar span{position:relative;z-index:1}.bar b{position:relative;z-index:1;float:right;color:#475569;font-size:13px}
.bar.on{border-color:var(--pri2)}.bar.on i{background:#bfdbfe}
.tl{position:relative;padding-left:18px;margin:0 0 14px}
.tl::before{content:"";position:absolute;left:4px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--pri2)}
.tl::after{content:"";position:absolute;left:8px;top:20px;bottom:-14px;width:1.5px;background:var(--line)}
.tl:last-child::after{display:none}
.tl.cur::before{background:var(--ok);box-shadow:0 0 0 4px #d1fae5}
.tl.cur .tt{color:var(--ok)}
.tl .tt{font-size:13px;font-weight:700;color:var(--pri)}.tl .ti{font-weight:600;font-size:14.5px}.tl .su{font-size:12.5px;color:var(--sub)}
.tl ul{list-style:none;margin:6px 0 0;padding:9px 11px;background:#fff1f2;border-radius:10px;font-size:12.5px}
.tl li{display:flex;gap:8px;padding:2px 0}.tl li b{width:42px;flex:none}
.gl button{display:flex;width:100%;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid #f1f5f9;font-weight:600;text-align:left}
.gl button:last-child{border:0}.gl i{font-style:normal;font-size:20px}
#sheet,#viewer,#join{position:absolute;inset:0;z-index:50;display:none}
#sheet.on{display:flex;align-items:flex-end;background:rgba(15,23,42,.55)}
.sh{background:var(--card);width:100%;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column}
.sh .top{display:flex;align-items:center;padding:14px 16px 8px}
.sh .top h2{margin:0;font-size:17px;flex:1}
#shB{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 16px}
#shF{border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#viewer.on{display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.93);flex-direction:column}
#viewer img,#viewer video{max-width:100%;max-height:88%;object-fit:contain}
#viewer .x{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;color:#fff;font-size:28px;z-index:2;width:44px;height:44px}
#viewer .jp{color:#fff;font-size:42px;font-weight:700;text-align:center;padding:24px;line-height:1.35}
#viewer .jp small{display:block;font-size:17px;font-weight:400;opacity:.75;margin-top:16px}
#viewer .vbar{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;display:flex;gap:10px;justify-content:center}
#join.on{display:flex;background:linear-gradient(160deg,#1e40af,#4f46e5);align-items:center;justify-content:center;padding:22px}
#join .box{background:#fff;border-radius:20px;padding:22px;width:100%}
label.f{display:block;font-size:12.5px;font-weight:600;color:#475569;margin:12px 0 4px}
.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#f8fafc;outline:none}
textarea.in{resize:vertical}
.ed{background:#f8fafc}.ed label.f:first-child{margin-top:0}
.pv{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pv div{position:relative;width:70px;height:70px;border-radius:10px;overflow:hidden;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center}
.pv img{width:100%;height:100%;object-fit:cover}
.pv button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:20px}
.prog{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--pri2);width:0;transition:width .2s}
.hint{font-size:12.5px;color:var(--sub);margin-top:6px}
.warnbox{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;font-size:13px;color:#92400e;margin-top:10px;white-space:pre-wrap}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:90px;background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86%;text-align:center}
#toast.on{opacity:1}
.ribbon{background:#fef3c7;color:#92400e;font-size:12px;text-align:center;padding:4px;font-weight:600}
.ph{background:#fdf2f8;border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.ph .b{flex:1}.ph b{display:block;font-size:14px}.ph span{font-size:12.5px;color:#475569}
.ck{display:flex;gap:10px;align-items:center;padding:11px;background:#f8fafc;border-radius:10px;margin-bottom:8px}
.ck input{width:20px;height:20px;flex:none}
.ct{display:flex;align-items:center;gap:10px;background:#f8fafc;border-radius:12px;padding:11px;margin-bottom:8px}
.ct .b{flex:1;min-width:0}.ct b{display:block;font-size:14px}.ct span{font-size:12px;color:var(--sub)}.ct .cp{color:var(--pri);font-weight:600;font-size:13.5px;text-align:left;word-break:break-all}
.mem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9}.mem:last-child{border:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin-top:8px}.kv span{color:var(--sub)}
.bell{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #f1f5f9;width:100%;text-align:left}
.bell i{font-style:normal;font-size:20px}.bell.new{background:#eff6ff;margin:0 -16px;padding:11px 16px;width:calc(100% + 32px)}
ul.pl{margin:0;padding-left:18px}ul.pl li{margin-bottom:8px}
.adm{border:1px dashed #94a3b8;background:#f8fafc}
</style>
</head>
<body>
<div id="app">
  <div class="ribbon" id="ribbon" hidden></div>
  <header>
    <h1>히로시마 교류 🇯🇵<small>김천중앙고등학교 · 12.21 – 12.24</small></h1>
    <button class="hbtn" data-act="bell" aria-label="알림">🔔<span class="badge" id="bellBadge"></span></button>
    <button class="hbtn sos" data-act="sos" aria-label="비상 연락">📞</button>
  </header>
  <main>
    <section class="view on" id="v-home"></section>
    <section class="view" id="v-talk">
      <div class="seg">
        <button class="on" data-act="pane" data-p="chat">채팅<span class="badge" id="chatBadge"></span></button>
        <button data-act="pane" data-p="feed">사진·영상<span class="badge" id="feedBadge"></span></button>
      </div>
      <div class="pane on" id="p-chat">
        <div class="chips" id="roomChips"></div>
        <div id="chatList"></div>
        <div class="inbar">
          <button class="ibtn" data-act="chatImg" aria-label="사진">📷</button>
          <textarea id="chatIn" rows="1" placeholder="메시지 입력"></textarea>
          <button class="ibtn send" data-act="chatSend" aria-label="보내기">➤</button>
        </div>
      </div>
      <div class="pane" id="p-feed">
        <div class="chips" id="feedChips"></div>
        <div id="feedWrap"><div id="feedList"></div><div id="albumBox"></div><div class="empty" id="feedEmpty">아직 올라온 글이 없어요.<br>첫 사진을 올려 보세요!</div></div>
        <button class="fab" data-act="compose" data-tag="feed">＋ 글쓰기</button>
      </div>
    </section>
    <section class="view" id="v-mission"></section>
    <section class="view" id="v-members"></section>
    <section class="view" id="v-guide"></section>
  </main>
  <nav>
    <button class="on" data-act="tab" data-t="home"><i>🏠</i>홈</button>
    <button data-act="tab" data-t="talk"><i>💬<span class="badge" id="talkBadge"></span></i>소통</button>
    <button data-act="tab" data-t="mission"><i>🎯</i>미션</button>
    <button data-act="tab" data-t="members"><i>👥</i>멤버</button>
    <button data-act="tab" data-t="guide"><i>🗓️</i>일정·안내</button>
  </nav>

  <div id="sheet" data-act="sheetBg">
    <div class="sh">
      <div class="top"><h2 id="shT"></h2><button class="hbtn" data-act="closeSheet" aria-label="닫기">✕</button></div>
      <div id="shB"></div>
      <div id="shF" hidden></div>
    </div>
  </div>
  <div id="viewer"><button class="x" data-act="closeViewer" aria-label="닫기">✕</button><div id="viewerBody" style="display:contents"></div></div>
  <div id="join"><div class="box" id="joinBox"></div></div>
  <div id="toast"></div>
  <input type="file" id="pickImg" accept="image/*" multiple hidden>
  <input type="file" id="pickVid" accept="video/*" hidden>
  <input type="file" id="pickChatImg" accept="image/*" hidden>
  <input type="file" id="pickBingo" accept="image/*" hidden>
</div>

<script type="module">
/* ============================================================
   ① 설정 — 이 부분만 채우면 됩니다 (설정안내.md 참고)
   ============================================================ */
const CONFIG = {
  firebase: {            // Firebase 콘솔 > 프로젝트 설정 > 내 앱 > SDK 설정에서 복사

    authDomain: "international-exchange-app.firebaseapp.com",
    databaseURL: "https://international-exchange-app-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "international-exchange-app",
    appId: "1:1078873567564:web:dbfae90d74b2dade411fe9"
  },

const blobToData = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });

/* 용량 초과 영상 압축 시도(지원 기기 한정, 영상 길이만큼 시간이 걸림) */
function compressVideo(file, onProg) {
  return new Promise((res, rej) => {
    const v = document.createElement('video');
    if (!v.captureStream || !window.MediaRecorder) return rej(new Error('이 기기는 자동 압축을 지원하지 않습니다.'));
    v.src = URL.createObjectURL(file); v.muted = true; v.playsInline = true;
    const fail = e => rej(e instanceof Error ? e : new Error('압축 실패'));
    v.onerror = fail;

      try {
        const sc = Math.min(1, 720 / Math.min(v.videoWidth, v.videoHeight)), c = document.createElement('canvas');
        c.width = Math.round(v.videoWidth * sc / 2) * 2; c.height = Math.round(v.videoHeight * sc / 2) * 2; const ctx = c.getContext('2d');
        await v.play();
        const out = c.captureStream(30); v.captureStream().getAudioTracks().forEach(t => out.addTrack(t));
        const mime = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
        const rec = new MediaRecorder(out, { mimeType: mime, videoBitsPerSecond: 2500000, audioBitsPerSecond: 96000 }), chunks = [];

        rec.onstop = () => { const b = new Blob(chunks, { type: mime.split(';')[0] }); b.name = 'video.' + (mime.includes('mp4') ? 'mp4' : 'webm'); res(b); };

}

async function doJoin() {
  const name = $('#jName').value.trim(), sel = $('#jGroup').value, code = $('#jCode').value.trim(), pin = $('#jPin').value.trim(), err = $('#jErr');
  if (!name) return (err.textContent = '이름을 입력해 주세요.'); if (!code) return (err.textContent = '입장 코드를 입력해 주세요.');
  let role = sel === 'T' ? 'teacher' : 'student';
  if (role !== 'student' && !pin) return (err.textContent = '교사 코드를 입력해 주세요.');
  err.textContent = '확인 중…';
  try { await B.set('members/' + uid, code); } catch { return (err.textContent = '입장 코드가 맞지 않습니다.'); }
  if (role === 'teacher') {   // 코드가 교사 코드면 인솔 교사, 운영 담당 비밀번호면 운영 담당
    if (DEMO) role = pin === 'admin' ? 'admin' : 'teacher';
    else { try { await B.set('teachers/' + uid, pin); } catch { try { await B.set('admins/' + uid, pin); role = 'admin'; } catch { return (err.textContent = '교사 코드가 맞지 않습니다.'); } } }
  }
  me = { name, group: role === 'student' ? sel : 'T', role };
  try { await B.set('users/' + uid, { ...me, ts: B.now() }); } catch (e) { return (err.textContent = '저장에 실패했습니다: ' + e.message); }
  ls.set('me', me); ls.set('joinedUid', uid); $('#join').classList.remove('on'); start();
}

let started = false, votesSub = false;
function start() {
  if (started) return render(); started = true; loadCache();
  for (const k of ['users', 'posts', 'comments', 'reactions', 'acks', 'roll', 'rollChecks', 'content', 'muster', 'polls', 'pollVotes', 'bingo']) B.on(k, v => { S[k] = v; sched(); });
  B.on('hook', v => { S.hook = v; });
  B.on('notices', v => { if (noticesReady) Object.entries(v).forEach(([id, n]) => { if (!S.notices[id] && n.uid !== uid) toast('📢 새 공지: ' + String(n.text).slice(0, 40)); }); S.notices = v; noticesReady = true; sched(); });
  const subbed = new Set(), subRoom = r => { if (subbed.has(r)) return; subbed.add(r); B.on('chat/' + r, v => { S.chat[r] = v; sched(); }, 300); };
  (isStaff() ? ['all', ...GS] : ['all', me.group, 'dm_' + uid]).forEach(subRoom);
  if (isStaff()) { B.on('users', v => Object.entries(v).forEach(([id, u]) => !staffOf(u) && subRoom('dm_' + id))); B.on('info', v => { S.info = v; sched(); }); }
  else B.on('info/' + uid, v => { S.info = { [uid]: v }; sched(); });
  const subVotes = () => { if (votesSub) return; votesSub = true; B.on('votes', v => { S.votes = v; sched(); }); };
  B.on('votes/' + uid, v => { S.myVote = typeof v === 'string' ? v : null; sched(); });
  B.on('vote', v => { S.vote = v; if (isAdmin() || (v.mission && v.open === false)) subVotes(); sched(); });
  fetchWeather(); setInterval(fetchWeather, 30 * 60e3); setInterval(sched, 30000); render();
}

  /* 공유 · 메일 알림 설정 */
  async share(el) { const t = el.dataset.t; if (navigator.share) { try { await navigator.share({ text: t }); } catch {} } else { try { await navigator.clipboard.writeText(t); toast('복사했습니다. 카톡방에 붙여 넣으세요.'); } catch { toast('공유를 지원하지 않는 기기입니다.'); } } },
  hookSet() { const h = S.hook || {}; openSheet('✉️ 1:1 채팅 메일 알림', `<div class="hint" style="margin:0 0 6px">학생이 "선생님께 채팅"으로 메시지를 보내면 운영 담당 메일로 알려 줍니다. 설정안내.md의 "메일 알림" 순서대로 구글 앱스 스크립트를 만든 뒤, 그 주소와 토큰을 여기에 넣으세요.</div><label class="f">앱스 스크립트 웹 앱 주소</label><input class="in" id="hkU" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(h.url || '')}"><label class="f">토큰 (스크립트의 TOKEN과 같은 값)</label><input class="in" id="hkT" autocapitalize="off" value="${esc(h.token || '')}"><div class="row" style="margin-top:14px"><button class="btn" data-act="hookSave">저장</button><button class="btn ghost" data-act="hookTest">시험 메일 보내기</button><span class="sp"></span><button class="btn red" data-act="hookOff">끄기</button></div><div class="hint">같은 학생의 연속 메시지는 2분에 한 번만 메일로 갑니다. 메일은 보통 1분 안에 도착합니다.</div>`); },
  async hookSave() { const url = $('#hkU').value.trim(), token = $('#hkT').value.trim(); if (!/^https:\/\/script\.google\.com\//.test(url) || !token) return toast('주소(https://script.google.com/…)와 토큰을 입력해 주세요.'); await B.set('hook', { url, token }).then(() => { toast('저장했습니다.'); sched(); }).catch(e => toast('실패: ' + e.message)); },
  hookTest() { const url = $('#hkU').value.trim(), token = $('#hkT').value.trim(); if (!url) return toast('주소를 먼저 입력해 주세요.'); fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token, uid: 'test' + Date.now(), name: me.name, group: '시험', text: '메일 알림 시험입니다.', url: appUrl() }) }).then(() => toast('보냈습니다. 1분 안에 메일이 오는지 확인하세요.')).catch(() => toast('전송 실패. 주소를 확인해 주세요.')); },
  async hookOff(el) { if (armed(el)) await B.remove('hook').then(() => { closeSheet(); toast('메일 알림을 껐습니다.'); sched(); }).catch(() => toast('실패')); },
  /* 간단 투표 */
  newPoll() { openSheet('📊 투표 만들기', `<label class="f">질문</label><input class="in" id="pQ" maxlength="60" placeholder="예) 내일 자유시간에 가고 싶은 곳은?"><label class="f">선택지 (한 줄에 하나, 2~5개)</label><textarea class="in" id="pO" rows="4" placeholder="오코노미야키 골목\n혼도리 상점가"></textarea><button class="btn big full" style="margin-top:12px" data-act="sendPoll">투표 올리기</button>`); },
  async sendPoll() { const q = $('#pQ').value.trim(), opts = lines($('#pO').value).slice(0, 5); if (!q || opts.length < 2) return toast('질문과 선택지 2개 이상을 입력해 주세요.'); await B.push('polls', { q, opts, open: true, uid, ts: B.now() }).then(() => shareSheet('투표를 올렸습니다', `📊 투표: ${q}\n${opts.map((o, i) => `${i + 1}. ${o}`).join('\n')}`)).catch(e => toast('실패: ' + e.message)); },
  async pollVote(el) { await B.set(`pollVotes/${el.dataset.id}/${uid}`, +el.dataset.i).catch(() => toast('연결을 확인해 주세요.')); },
  async pollClose(el) { if (armed(el)) await B.set(`polls/${el.dataset.id}/open`, false).catch(() => toast('실패')); },
  async pollDel(el) { if (armed(el)) await B.remove('polls/' + el.dataset.id).catch(() => toast('실패')); },
  /* 포토 빙고 */
  bingoG(el) { bingoG = el.dataset.g; render(); },
  bingoCell(el) { const g = el.dataset.g, i = +el.dataset.i, c = bcell(g, i), mine = g === me.group;
    if (c?.u) return openViewer(`<img src="${esc(full(c.u))}" alt="">` + `<div class="vbar"><span class="btn sm gray">${esc(lines(C('bingo'))[i] || '')} · ${esc(c.name || '')}</span>${mine ? `<button class="btn sm" data-act="bingoRe" data-i="${i}">사진 바꾸기</button>` : ''}${isAdmin() ? `<button class="btn sm red" data-act="bingoDel" data-g="${g}" data-i="${i}">삭제</button>` : ''}</div>`);
    if (!mine) return toast('우리 조 빙고판에서만 올릴 수 있어요.'); bingoIdx = i; $('#pickBingo').click(); },
  bingoRe(el) { closeViewer(); bingoIdx = +el.dataset.i; $('#pickBingo').click(); },
  async bingoDel(el) { if (armed(el)) await B.remove(`bingo/${el.dataset.g}/c${el.dataset.i}`).then(closeViewer).catch(() => toast('실패')); },
  /* 숏폼 투표 */
  async voteOpen() { await B.remove('votes').catch(() => {}); await B.set('vote', { mission: $('#voteM').value, open: true, uid, ts: B.now() }).then(() => shareSheet('숏폼 투표를 시작했습니다', '🏆 숏폼 투표 시작!\n미션 탭 맨 아래에서 다른 조 영상에 투표해 주세요.')).catch(e => toast('실패: ' + e.message)); },
  async voteCast(el) { const pid = el.dataset.pid; try { if (S.myVote === pid) await B.remove('votes/' + uid); else await B.set('votes/' + uid, pid); } catch { toast('투표가 마감되었거나 연결이 불안정합니다.'); } },
  async voteClose(el) { if (armed(el)) await B.set('vote/open', false).then(() => shareSheet('결과를 공개했습니다', '🏆 숏폼 투표 결과가 공개되었습니다!\n미션 탭에서 확인하세요.')).catch(() => toast('실패')); },
  async voteReset(el) { if (armed(el)) { await B.remove('votes').catch(() => {}); await B.remove('vote').catch(() => toast('실패')); S.votes = {}; } },
  /* 내 정보 */
  editInfo(el) { const u = S.users[el.dataset.uid] || {}, i = S.info?.[el.dataset.uid] || {}; openSheet(`🪪 ${u.name || ''} 정보 입력`, `<label class="f">방 번호</label><input class="in" id="iRoom" value="${esc(i.room || '')}" placeholder="예) 1203"><label class="f">룸메이트</label><input class="in" id="iMate" value="${esc(i.mate || '')}"><label class="f">버스 좌석</label><input class="in" id="iSeat" value="${esc(i.seat || '')}" placeholder="예) 3A"><label class="f">메모 (선택)</label><input class="in" id="iMemo" value="${esc(i.memo || '')}"><div class="hint">본인과 인솔 교사만 볼 수 있습니다.</div><button class="btn big full" style="margin-top:12px" data-act="saveInfo" data-uid="${el.dataset.uid}">저장</button>`); },
  async saveInfo(el) { await B.set('info/' + el.dataset.uid, { room: $('#iRoom').value.trim(), mate: $('#iMate').value.trim(), seat: $('#iSeat').value.trim(), memo: $('#iMemo').value.trim() }).then(() => { closeSheet(); toast('저장했습니다.'); }).catch(e => toast('실패: ' + e.message)); },
  /* 편집기 */
  edit(el) { EDITORS[el.dataset.ed](el.dataset.arg); }, editSched() { EDITORS.sched(); }, editDay() { EDITORS.day(); }, editMissions() { EDITORS.missions(); }, editBingo() { EDITORS.bingo(); },
  edAdd() { edRead(); ED.items.push(ED.mk()); drawEd(); const b = $('#shB'); b.scrollTop = b.scrollHeight; },
  edDel(el) { if (!armed(el)) return; edRead(); ED.items.splice(+el.closest('.ed').dataset.i, 1); drawEd(); },
  edMove(el) { edRead(); const i = +el.closest('.ed').dataset.i, j = i + +el.dataset.d; if (j < 0 || j >= ED.items.length) return; [ED.items[i], ED.items[j]] = [ED.items[j], ED.items[i]]; drawEd(); },
  edSave() { if (ED.text) return ED.onSave($('#edTxt').value); edRead(); ED.onSave(clone(ED.items)); },
  async edReset(el) { if (armed(el)) await B.remove('content/' + ED.reset).then(() => { closeSheet(); toast('기본 내용으로 되돌렸습니다.'); }).catch(() => toast('실패')); },
  say(el) { if (!window.speechSynthesis) return toast('이 기기는 음성 재생을 지원하지 않습니다.'); speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(el.dataset.jp); u.lang = 'ja-JP'; u.rate = 0.85; speechSynthesis.speak(u); },
  show(el) { openViewer(`<div class="jp" style="white-space:pre-wrap">${esc(el.dataset.jp)}<small>${esc(el.dataset.ko)}</small></div>`); },
  join: doJoin, rename() { showJoin(true); }, cancelJoin() { $('#join').classList.remove('on'); },
  async saveName() { const name = $('#jName').value.trim(); if (!name) return; me.name = name; ls.set('me', me); await B.set('users/' + uid + '/name', name).catch(() => {}); $('#join').classList.remove('on'); render(); toast('수정했습니다. 새로 쓰는 글부터 적용됩니다.'); }
};
function armed(el, msg = '한 번 더 누르면 실행') { if (el.dataset.armed) return true; el.dataset.armed = 1; const o = el.innerHTML; el.textContent = msg; setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.innerHTML = o; } }, 2500); return false; }

document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const f = A[el.dataset.act]; if (f) f(el, e); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.ck != null) { const ck = ls.get('check2', {}); ck[t.dataset.ck] = t.checked; ls.set('check2', ck); }
  if (t.id === 'jGroup') $('#jPinBox').hidden = t.value !== 'T';
  if (t.id === 'pickImg' && composing) { for (const f of t.files) { if (composing.imgs.length >= 5) { toast('사진은 최대 5장입니다.'); break; } composing.imgs.push({ file: f, url: URL.createObjectURL(f) }); } t.value = ''; drawPv(); }
  if (t.id === 'pickVid') { const f = t.files[0]; t.value = ''; onPickVid(f); }
  if (t.id === 'pickChatImg') { const f = t.files[0]; t.value = ''; if (f) (async () => { toast('사진 보내는 중…'); try { const r = await upload(await shrink(f), 'image'); await B.push('chat/' + room, { uid, name: me.name, group: me.group, text: '', img: r.u, ts: B.now() }); if (room === 'dm_' + uid) notifyMail('(사진을 보냈습니다)'); } catch (er) { toast(er.message || '전송 실패'); } })(); }
  if (t.id === 'pickBingo') { const f = t.files[0], i = bingoIdx; t.value = ''; if (f && i >= 0) (async () => { toast('인증샷 올리는 중…'); try { const r = await upload(await shrink(f), 'image'); await B.set(`bingo/${me.group}/c${i}`, { u: r.u, uid, name: me.name, ts: B.now() }); const s = bstat(me.group); toast(s.l ? `빙고 ${s.l}줄! 🎉` : '칸을 채웠습니다!'); } catch (er) { toast(er.message || '업로드 실패'); } })(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'chatIn') { t.style.height = ''; t.style.height = Math.min(t.scrollHeight, 96) + 'px'; }
  if (t.id === 'yenIn' || t.id === 'yenRate') { const r = parseFloat($('#yenRate').value) || 0, y = parseFloat($('#yenIn').value.replace(/,/g, '')) || 0; if (t.id === 'yenRate' && r) ls.set('yenRate', r); $('#yenOut').textContent = '약 ' + Math.round(y * r).toLocaleString('ko-KR') + '원'; }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing && e.target.id === 'cmtIn') { e.preventDefault(); $('[data-act="cmtSend"]').click(); } });

/* ---------- 시작 ---------- */
(async () => {
  const rb = $('#ribbon');
  if (DEMO) { rb.hidden = false; rb.textContent = '체험 모드 · 이 기기에만 저장됩니다 (설정 전)'; }
  try { B = DEMO ? demoBackend() : await fbBackend(); uid = B.uid; }
  catch (e) { console.error(e); rb.hidden = false; rb.textContent = '서버에 연결하지 못했습니다. 저장된 내용만 볼 수 있습니다.'; me = ls.get('me') || { name: '손님', group: 'g1', role: 'student' }; uid = ls.get('joinedUid') || 'offline'; loadCache(); const no = async () => { throw new Error('오프라인'); }; B = { uid, conn() {}, on() {}, get: async () => null, push: no, set: no, remove: no, now: () => Date.now() }; return render(); }
  let offT; B.conn(ok => { clearTimeout(offT); if (ok) { if (!DEMO) rb.hidden = true; } else offT = setTimeout(() => { rb.hidden = false; rb.textContent = '오프라인 · 저장된 내용을 보여 줍니다. 연결되면 자동으로 이어집니다.'; }, 4000); });
  const cm = ls.get('me');
  if (cm && ls.get('joinedUid') === uid) {   // 이미 가입한 기기: 인터넷이 없어도 바로 시작
    me = cm; start();
    B.get('users/' + uid).then(p => { if (p) { me = { name: p.name, group: p.group, role: p.role }; ls.set('me', me); sched(); } }).catch(() => {});
    return;
  }
  let member = null, prof = null;
  try { member = await B.get('members/' + uid); if (member) prof = await B.get('users/' + uid); } catch (e) { console.warn(e); }
  if (member && prof) { me = { name: prof.name, group: prof.group, role: prof.role }; ls.set('me', me); ls.set('joinedUid', uid); start(); } else showJoin(false);
})();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
